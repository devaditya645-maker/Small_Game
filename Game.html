<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .play{
       height: 200px;
       width: 200px;
        border:none;
        border-radius:50%;
      }
      .end{
        height: 60px;
        border: none;
        border-radius: 50%;
      }
    </style>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
  
    <!-- Structure -->
    <h1 class="text-center bg-dark text-warning fw-bolder display-1">
      Lets Play Stone Paper Scissors Game
    </h1>
    <div class="container-fluid my-5 ">
      <div class="row text-center">
        <div class="col-lg-4">
          <h1 class="display-1"><button class="play bg-primary" onclick="playGame('Stone')" title="stone">✊</button></h1>
        </div>
        <div class="col-lg-4">
          <h1 class="display-1"><button class="play bg-primary" onclick="playGame('Paper')" title="paper">✋</button></h1>
        </div>
        <div class="col-lg-4">
          <h1 class="display-1"><button class="play bg-primary" onclick="playGame('Scissor')"title=scissor>✌️</button></h1>
        </div>
      </div>
    </div>
    <h1 class="text-center fw-bold text-dark"><p class="FinalResult"></p></h1>
    <h1 class="text-center fw-bold text-dark"><p class="Move"></p></h1>
    <h1 class="text-center fw-bold text-dark"><p class="Score"></p></h1>
    <hr/>
    <div class="text-end me-5"><h1><button  class="end text-light bg-primary" 
      onclick="
        ((Score.wins *= 0), (Score.looses *= 0), (Score.draw *= 0));
        localStorage.removeItem('Score');
        UpdateScore();
        ResetScore();
      "
      title="Refresh"
    >
      🔄️
    </button></h1>
  </div>

    <!-- JS -->
    <script>
      let Score = JSON.parse(localStorage.getItem("Score")) || {
        wins: 0,
        looses: 0,
        draw: 0,
      };
      UpdateScore();
      function computerMove() {
        let random = Math.random();
        let ComputerMove = "";
        if (random > 0 && random <= 1 / 2) {
          ComputerMove = "Stone";
        } else if (random > 1 / 2 && random < 2 / 3) {
          ComputerMove = "Paper";
        } else {
          ComputerMove = "Scissor";
        }
        return ComputerMove;
      }

      function playGame(PlayerMove) {
        const ComputerMove = computerMove();
        let result = "";
        if (
          (PlayerMove === "Stone" && ComputerMove === "Stone") ||
          (PlayerMove === "Paper" && ComputerMove === "Paper") ||
          (PlayerMove === "Scissor" && ComputerMove === "Scissor")
        ) {
          result = "Draw";
        } else if (
          (PlayerMove === "Stone" && ComputerMove === "Paper") ||
          (PlayerMove === "Paper" && ComputerMove === "Scissor") ||
          (PlayerMove === "Scissor" && ComputerMove === "Stone")
        ) {
          result = "Loose";
        } else if (
          (PlayerMove === "Stone" && ComputerMove === "Scissor") ||
          (PlayerMove === "Paper" && ComputerMove === "Stone") ||
          (PlayerMove === "Scissor" && ComputerMove === "Paper")
        ) {
          result = "Win";
        }

        if (result === "Win") {
          Score.wins++;
        } else if (result === "Loose") {
          Score.looses++;
        } else if (result === "Draw") {
          Score.draw++;
        }
        localStorage.setItem("Score", JSON.stringify(Score));
        UpdateScore();
        document.querySelector(".FinalResult").innerHTML = `You : <u><b class="text-danger">${result}</b></u>`;
        document.querySelector(".Move").innerHTML =
          `Your Move : <u><b class="text-danger">${PlayerMove}</b></u> | Computer Move :  <u><b class="text-danger">${ComputerMove}</b></u> `;
      }
      function UpdateScore() {
        document.querySelector(".Score").innerHTML = `Wins : ${Score.wins} |
        Looses : ${Score.looses} |
        Draw : ${Score.draw}`;
      }
      function ResetScore() {
        let Score = {
          wins: 0,
          looses: 0,
          draw: 0,
        };
        localStorage.setItem("Score", JSON.stringify(Score));
        UpdateScore();
        document.querySelector(".FinalResult").innerHTML = "";
        document.querySelector(".Move").innerHTML = "";
      }
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
